name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: npm run build

      - name: Remove any existing Pages artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking for existing github-pages artifacts in run $GITHUB_RUN_ID..."
          gh api repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts \
            --paginate -H "Accept: application/vnd.github+json" \
            | jq -r '.artifacts[] | select(.name == "github-pages") | .id' \
            | while read -r id; do
                if [ -n "$id" ]; then
                  gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$id -X DELETE
                  echo "Deleted artifact $id"
                fi
              done
          echo "Cleanup step complete."


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4