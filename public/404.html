<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIHCORD</title>
    <script>
      // GitHub Pages SPA fallback — route all unknown paths to index.html
      const p = window.location.pathname;
      if (!p.startsWith("/assets/") && !p.startsWith("/favicon") && p !== "/index.html") {
        window.location.replace("/index.html" + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/index.html" />
    </noscript>
  </body>
</html>
